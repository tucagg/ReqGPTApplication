name: reqgpt_flutter
description: AI-augmented requirements elicitation and analysis mobile app prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  uuid: ^4.4.2
  intl: ^0.20.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  flutter_markdown_plus: ^1.0.7
  webview_flutter: ^4.10.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
